name: Test installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Syntax + lint (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in 'shams_gcc.ps1', 'shams_gcc_remove.ps1') {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$f", [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $failed = $true; Write-Host "$f : FAILED"; $errs | Format-List } else { Write-Host "$f : OK" }
          }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning
          $r | Format-Table -AutoSize
          if ($r | Where-Object Severity -eq 'Error') { exit 1 }

  install-test:
    name: Install / uninstall (Windows, ${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]   # Windows PowerShell 5.1 and PowerShell 7+
    steps:
      - uses: actions/checkout@v4

      # The runner image ships with GCC (MinGW, MSYS2, Strawberry Perl, ...).
      # Move the usual install folders out of the way so the installer starts
      # from a clean machine and the remover has nothing big to delete.
      - name: Prepare clean machine
        shell: pwsh
        run: |
          foreach ($d in 'C:\mingw64','C:\mingw32','C:\mingw','C:\msys64','C:\winlibs','C:\tdm-gcc') {
            if (Test-Path $d) {
              try {
                Rename-Item -Path $d -NewName ((Split-Path $d -Leaf) + '.runner-bak') -ErrorAction Stop
                Write-Host "Moved $d"
              } catch { Write-Warning "Could not move $d : $_" }
            }
          }

      # The scripts draw a full-screen console UI, which fails without a real
      # console. Start-Process gives each run its own (hidden) console window.
      - name: Run installer
        shell: pwsh
        run: |
          # The installer exits early if gcc is on PATH, so drop every dir that has gcc.exe
          $env:Path = ($env:Path -split ';' | Where-Object {
            $_ -and -not [IO.File]::Exists([IO.Path]::Combine($_, 'gcc.exe'))
          }) -join ';'
          if (Get-Command gcc -ErrorAction SilentlyContinue) { throw 'gcc is still on PATH' }

          $script = (Resolve-Path .\shams_gcc.ps1).Path
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process ${{ matrix.shell }} -PassThru -Wait -WindowStyle Hidden `
                 -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$script
          Write-Host "Installer exit code: $($p.ExitCode) after $($sw.Elapsed)"
          if ($p.ExitCode -ne 0) { throw "Installer exited with code $($p.ExitCode)" }

      - name: Verify install
        shell: pwsh
        run: |
          $bin = 'C:\mingw64\mingw64\bin'
          if (-not (Test-Path "$bin\gcc.exe")) { throw "gcc.exe not found in $bin" }

          # PATH entry must be in the USER scope only
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          $mach = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($user -notlike "*$bin*") { throw 'User PATH missing toolchain entry' }
          if ($mach -like "*$bin*")    { throw 'Machine PATH was modified' }

          # Compile and run a real program
          & "$bin\gcc.exe" --version
          & "$bin\g++.exe" --version
          Set-Content hello.c '#include <stdio.h>
          int main(void){ puts("hello from gcc"); return 0; }'
          & "$bin\gcc.exe" hello.c -o hello.exe
          if ($LASTEXITCODE -ne 0) { throw 'gcc failed to compile hello.c' }
          $out = .\hello.exe
          if ($out -ne 'hello from gcc') { throw "Unexpected output: $out" }

      - name: Second run exits cleanly (already installed)
        shell: pwsh
        run: |
          $env:Path = "C:\mingw64\mingw64\bin;$env:Path"
          $script = (Resolve-Path .\shams_gcc.ps1).Path
          $p = Start-Process ${{ matrix.shell }} -PassThru -Wait -WindowStyle Hidden `
                 -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$script
          Write-Host "Second run exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Second run exited with code $($p.ExitCode)" }
          if (-not (Test-Path C:\mingw64\mingw64\bin\gcc.exe)) { throw 'Second run damaged the install' }

      - name: Run remover
        shell: pwsh
        run: |
          # Only target our install, not the other compilers the runner has on PATH
          $env:Path = ($env:Path -split ';' | Where-Object {
            $_ -and -not [IO.File]::Exists([IO.Path]::Combine($_, 'gcc.exe'))
          }) -join ';'

          $script = (Resolve-Path .\shams_gcc_remove.ps1).Path
          $p = Start-Process ${{ matrix.shell }} -PassThru -Wait -WindowStyle Hidden `
                 -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$script,'-Force'
          Write-Host "Remover exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Remover exited with code $($p.ExitCode)" }

      - name: Verify removal
        shell: pwsh
        run: |
          if (Test-Path C:\mingw64) { throw 'C:\mingw64 still exists' }
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($user -like '*mingw64*') { throw 'User PATH still has mingw64' }

      - name: Debug state on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "C:\mingw64 exists : $(Test-Path C:\mingw64)"
          Write-Host "gcc.exe exists    : $(Test-Path C:\mingw64\mingw64\bin\gcc.exe)"
          Write-Host "User PATH         : $([Environment]::GetEnvironmentVariable('Path','User'))"
          Get-ChildItem C:\ -Directory | Select-Object -ExpandProperty Name
